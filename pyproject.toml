[project]
name = "nebula-mcp"
version = "0.6.0"
description = "Local MCP server for YueShu 5.3 graph databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.8,<5",
  "mcp>=2,<3",
  "nebula5_python==5.3.0",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=9.0.2,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
nebula-mcp = "nebula_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nebula_mcp"]
